[project]
name = "hedwig"
version = "0.1.6"
description = "Developer-native cyber threat early warning system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "tomli-w>=1.0",
    "prompt_toolkit>=3.0",
    "pyyaml>=6",
    "pydantic>=2",
    "httpx>=0.27",
]

[project.scripts]
hedwig = "hedwig.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hedwig"]

[tool.hatch.build.targets.sdist]
include = ["src/hedwig", "tests", "README.md", "install.sh", "install.ps1"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
