<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>One moment…</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f7f9; --fg: #1d2330; --muted: #6b7280; }
  @media (prefers-color-scheme: dark) { :root { --bg: #11151c; --fg: #e5e7eb; --muted: #9ca3af; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
         color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { text-align: center; padding: 24px; }
  .spin { width: 28px; height: 28px; margin: 0 auto 16px; border-radius: 50%;
          border: 3px solid var(--muted); border-top-color: transparent;
          animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { margin: 4px 0; } small { color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="spin"></div>
  <p id="msg">Checking your browser…</p>
  <small>This takes a moment and happens once per session.</small>
  <noscript><p>Please enable JavaScript to continue.</p></noscript>
</main>
<script>
(() => {
  "use strict";
  const TOKEN = "__TOKEN__", BITS = __BITS__;
  const K = new Uint32Array([
    0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
    0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
    0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2,
  ]);
  const M = new Uint32Array(64);
  const rotr = (x, n) => (x >>> n) | (x << (32 - n));

  // First 32-bit word of sha256(ascii string). Tokens and nonces are plain ASCII.
  function sha256Word0(str) {
    const n = str.length, words = ((n + 9 + 63) >> 6) << 4, w = new Uint32Array(words);
    for (let i = 0; i < n; i++) w[i >> 2] |= str.charCodeAt(i) << (24 - (i & 3) * 8);
    w[n >> 2] |= 0x80 << (24 - (n & 3) * 8);
    w[words - 1] = n * 8;
    let h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a;
    let h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19;
    for (let off = 0; off < words; off += 16) {
      for (let t = 0; t < 16; t++) M[t] = w[off + t];
      for (let t = 16; t < 64; t++) {
        const a = M[t - 15], b = M[t - 2];
        const s0 = rotr(a, 7) ^ rotr(a, 18) ^ (a >>> 3);
        const s1 = rotr(b, 17) ^ rotr(b, 19) ^ (b >>> 10);
        M[t] = (M[t - 16] + s0 + M[t - 7] + s1) | 0;
      }
      let a = h0, b = h1, c = h2, d = h3, e = h4, f = h5, g = h6, h = h7;
      for (let t = 0; t < 64; t++) {
        const t1 = (h + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & f) ^ (~e & g)) + K[t] + M[t]) | 0;
        const t2 = ((rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
        h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
      }
      h0 = (h0 + a) | 0; h1 = (h1 + b) | 0; h2 = (h2 + c) | 0; h3 = (h3 + d) | 0;
      h4 = (h4 + e) | 0; h5 = (h5 + f) | 0; h6 = (h6 + g) | 0; h7 = (h7 + h) | 0;
    }
    return h0;
  }

  const prefix = TOKEN + ":";
  let nonce = 0;
  function work() {
    const end = nonce + 50000;  // yield to the page every 50k hashes
    for (; nonce < end; nonce++) {
      if (Math.clz32(sha256Word0(prefix + nonce)) >= BITS) return submit(String(nonce));
    }
    setTimeout(work, 0);
  }
  async function submit(found) {
    try {
      const r = await fetch("/__hedwig/challenge", {
        method: "POST", credentials: "same-origin",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ token: TOKEN, nonce: found }),
      });
      if (!r.ok) throw new Error(String(r.status));
      location.replace(location.href);
    } catch (err) {
      document.getElementById("msg").textContent = "Could not verify your browser. Please reload.";
    }
  }
  setTimeout(work, 0);
})();
</script>
</body>
</html>
