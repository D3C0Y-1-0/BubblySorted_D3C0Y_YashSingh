# Hedwig Chakravyuha local stack, on one machine. Every port is published on 127.0.0.1 only.
# The Guard itself runs natively next to it (`uv run --project guard chakravyuha`): Docker
# Desktop rewrites source addresses, which would merge the loopback attackers into one IP.
name: chakravyuha
# One Elastic version for all three (9.5.5, the newest with images on Docker Hub, Oct 2026).


services:
  # -- the bank -----------------------------------------------------------------------------
  web:
    build: ../bank/web
    ports: ["127.0.0.1:9100:8080"]
    restart: unless-stopped

  transaction:
    build: ../bank/transaction
    ports: ["127.0.0.1:9101:8080"]
    volumes: ["../bank/transaction/logs:/app/logs"]
    restart: unless-stopped

  account:
    build: ../bank/account
    ports: ["127.0.0.1:9102:8080"]
    volumes: ["../bank/account/logs:/app/logs"]
    restart: unless-stopped

  support:
    build: ../bank/support
    ports: ["127.0.0.1:9103:8080"]
    volumes: ["../bank/support/logs:/app/logs"]
    restart: unless-stopped

  notifications:
    build: ../bank/notifications
    ports: ["127.0.0.1:9104:8080"]
    volumes: ["../bank/notifications/logs:/app/logs"]
    restart: unless-stopped

  # -- infrastructure the bank would use (for the demo's infrastructure report) ------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: demo-only-not-a-secret
      POSTGRES_DB: bank
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["127.0.0.1:6333:6333"]
    volumes: ["qdrantdata:/qdrant/storage"]
    restart: unless-stopped

  # -- ELK ----------------------------------------------------------------------------------
  elasticsearch:
    image: elasticsearch:9.5.5
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"   # bound to 127.0.0.1 only; never expose it
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports: ["127.0.0.1:9200:9200"]
    volumes: ["esdata:/usr/share/elasticsearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s"]
      interval: 10s
      retries: 30
    restart: unless-stopped

  logstash:
    image: logstash:9.5.5
    environment:
      LS_JAVA_OPTS: -Xms512m -Xmx512m
      xpack.monitoring.enabled: "false"
      config.reload.automatic: "true"
      api.http.host: 0.0.0.0
    volumes: ["./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro"]
    ports: ["127.0.0.1:5000:8080", "127.0.0.1:9600:9600"]  # events in (http), monitoring API
    depends_on:
      elasticsearch: { condition: service_healthy }
    restart: unless-stopped

  kibana:
    image: kibana:9.5.5
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports: ["127.0.0.1:5601:5601"]
    depends_on:
      elasticsearch: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 10s
      retries: 40
    restart: unless-stopped

  elk-setup:  # one-shot: index template + Kibana dashboard import
    image: curlimages/curl:8.11.1
    entrypoint: ["sh", "/elk/setup.sh"]
    volumes: ["./elk:/elk:ro"]
    depends_on:
      elasticsearch: { condition: service_healthy }
      kibana: { condition: service_started }
    restart: "no"

volumes:
  esdata:
  pgdata:
  qdrantdata:
