# Guard events arrive as newline-delimited JSON over HTTP (guard/src/chakravyuha/shipper.py);
# the 200 answer is the Guard's acknowledgement. Field names are dotted ECS-style keys
# ("source.ip"); Elasticsearch expands them, see ../../index-template.json.
input {
  http {
    port => 8080
    additional_codecs => { "application/x-ndjson" => "json_lines" }
    ecs_compatibility => "disabled"
  }
}

filter {
  # Browser or script, from the user agent the Guard records (truncated, attacker-controlled).
  if [user_agent.original] {
    useragent {
      source => "user_agent.original"
      target => "ua"
      ecs_compatibility => "disabled"
    }
  }
  # A numeric copy of the ring for charts: 1 to 7, the centre (the real bank) is 0.
  if [ring] == "centre" {
    mutate { add_field => { "hedwig.ring_n" => "0" } }
  } else if [ring] {
    mutate { add_field => { "hedwig.ring_n" => "%{ring}" } }
  }
  mutate { convert => { "hedwig.ring_n" => "integer" } }
  # Drop anything sensitive that should never be indexed. Passwords are never in events to
  # begin with (only hedwig.password_fp); this is a second line.
  mutate {
    remove_field => ["password", "passwd", "authorization", "cookie", "@version", "host", "headers", "event.original"]
    add_field => { "data_stream.dataset" => "chakravyuha.guard" }
  }
}

output {
  # event.id is the document id, so replaying the JSONL files (tools/backfill.py) is idempotent.
  if [event.id] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "chakravyuha-%{+YYYY.MM.dd}"
      document_id => "%{[event.id]}"
      ecs_compatibility => "disabled"
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "chakravyuha-%{+YYYY.MM.dd}"
      ecs_compatibility => "disabled"
    }
  }
}
