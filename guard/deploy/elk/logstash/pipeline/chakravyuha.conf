# Guard events arrive as JSON lines over TCP (guard/src/chakravyuha/shipper.py).
input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Browser or script, from the user agent the Guard records (truncated, attacker-controlled).
  if [user_agent.original] {
    useragent {
      source => "user_agent.original"
      target => "ua"
      ecs_compatibility => "disabled"
    }
  }
  # Drop anything sensitive that should never be indexed. Passwords are never in events to
  # begin with (only hedwig.password_fp), this is a second line.
  mutate {
    remove_field => ["password", "passwd", "authorization", "cookie", "@version", "host", "event.original"]
    add_field => { "data_stream.dataset" => "chakravyuha.guard" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "chakravyuha-%{+YYYY.MM.dd}"
    ecs_compatibility => "disabled"
  }
}
